name: Build Android Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.5.1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (FontConfig, curl, gradle)
        run: |
          apt-get update && apt-get install -y libfontconfig1 unzip python3 curl gradle

      - name: Setup Android SDK & Build Templates
        run: |
          GODOT_VERSION="4.5.1.stable"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/$GODOT_VERSION"
          
          mkdir -p "$TEMPLATE_DIR"
          
          # Скачиваем официальные шаблоны экспорта Godot 4.5.1
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz -O templates.tpz
          
          # Распаковываем во временную папку
          unzip -q templates.tpz -d temp_templates
          
          # Копируем содержимое в целевую директорию Godot
          cp -r temp_templates/templates/* "$TEMPLATE_DIR/"
          
          # Распаковываем android_source.zip в папку android/build проекта для Custom Build
          mkdir -p android/build
          if [ -f "$TEMPLATE_DIR/android_source.zip" ]; then
            unzip -q "$TEMPLATE_DIR/android_source.zip" -J -d android/build || unzip -q "$TEMPLATE_DIR/android_source.zip" -d android/build
            echo "Android source successfully extracted."
          else
            echo "Error: android_source.zip not found in $TEMPLATE_DIR!"
            ls -la "$TEMPLATE_DIR"
            exit 1
          fi

      - name: Build MeldInstaller AAR plugin
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "android/plugins/MeldInstaller" ]; then
            cd android/plugins/MeldInstaller
            
            # Генерация gradle wrapper версии 8.7 (требуется для AGP 8.5.0+)
            if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
              echo "Gradle wrapper jar missing. Generating wrapper..."
              gradle wrapper --gradle-version 8.7 || true
            fi
            
            if [ -f "gradlew" ]; then
              chmod +x gradlew
              ./gradlew assembleRelease --no-daemon
            else
              gradle assembleRelease --no-daemon
            fi
            
            mkdir -p build/outputs/aar
            if compgen -G "build/outputs/aar/*-release.aar" > /dev/null; then
              cp build/outputs/aar/*-release.aar MeldInstaller.aar
            elif compgen -G "build/outputs/aar/*.aar" > /dev/null; then
              cp build/outputs/aar/*.aar MeldInstaller.aar
            else
              echo "Error: AAR file not found after build!"
              exit 1
            fi
            cd ../../..
          fi

      - name: Prepare Export Configuration & Version
        run: |
          python3 -c '
          import configparser
          config = configparser.ConfigParser(strict=False)
          config.read("export_presets.cfg")
          if "preset.0" in config:
              config["preset.0"]["export_options/use_gradle_build"] = "true"
              config["preset.0"]["export_options/target_sdk"] = "33"
              config["preset.0"]["export_options/build_tools_version"] = "\"33.0.2\""
          with open("export_presets.cfg", "w") as configfile:
              config.write(configfile)
          '

      - name: Initialize Project & Import Assets
        run: |
          godot --headless --editor --quit

      - name: Create Release APK Directory
        run: |
          mkdir -p build/release

      - name: Export Android APK
        run: |
          godot --headless --export-release "Android" build/release/meld.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: meld-release-apk
          path: build/release/meld.apk

      - name: Send Telegram Notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            STATUS="${{ job.status }}"
            if [ "$STATUS" == "success" ]; then
              TEXT="✅ *Сборка Android (Meld) успешно завершена!*%0A📦 Репозиторий: $GITHUB_REPOSITORY%0A🔗 Ветка: $GITHUB_REF_NAME"
            else
              TEXT="❌ *Сборка Android (Meld) завершилась с ошибкой!*%0A📦 Репозиторий: $GITHUB_REPOSITORY%0A🔗 Ветка: $GITHUB_REF_NAME"
            fi
            
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d "chat_id=$TELEGRAM_CHAT_ID" \
              -d "text=$TEXT" \
              -d "parse_mode=Markdown"
          else
            echo "Telegram secrets not configured, skipping notification."
          fi